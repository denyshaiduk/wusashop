services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./data:/app/data
      - ./assets/images/products:/app/assets/images/products
    networks:
      - wusa

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - wusa

networks:
  wusa:

volumes:
  caddy_data:
  caddy_config: